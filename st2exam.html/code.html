<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Website Layout</title>

  <!-- External CSS file link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="site">

    <header class="site-header">
      <h1>AKASH PANDEY/ANY WEBSITE NAME</h1>
    </header>

    <div class="top-bar">
      <div class="left">Navigation / Ad space</div>
      <div class="right">Search • Login</div>
    </div>

    <main class="main">

      <aside class="sidebar">
        <h3>Side Menu</h3>
        <ul>
          <li>Item 1</li>
          <li>Item 2</li>
          <li>Item 3</li>
          <li>Item 4</li>
        </ul>
      </aside>

      <section class="content">
        <article class="card">
          <h2>Content Box 1</h2>
          <p>Yahan main content hoga.</p>
        </article>

        <article class="card">
          <h2>Content Box 2</h2>
          <p>Yahan second content hoga.</p>
        </article>
      </section>

    </main>

    <footer class="site-footer">
      © 2025 — Footer Section
    </footer>

  </div>

</html>
